                { id: 't7', name: '건강보험 자격득실 확인서 발급 신청서', fields: { '신청인 성명': '홍길동', '신청인 주민등록번호': '[주민등록번호 작성]', '신청인 연락처': '010-1234-5678', '주소': '경기도 평택시 현화길 12' }, content: '건강보험 자격득실 확인서 발급을 신청합니다.', footer: '본인 신청 시 신분증 확인이 필요합니다.' }
            ]
        };

        let currentCat = '증명서·인증';
        let currentForm = FORMS['증명서·인증'][0];
        let formData = {};

        const categoryContainer = document.getElementById('categoryContainer');
        const formSelect = document.getElementById('formSelect');
        const dynamicInputFields = document.getElementById('dynamicInputFields');
        const currentFormBadge = document.getElementById('currentFormBadge');
        const docTitle = document.getElementById('docTitle');
        const docTableContainer = document.getElementById('docTableContainer');
        const docContentContainer = document.getElementById('docContentContainer');
        const docFooterText = document.getElementById('docFooterText');
        const docDate = document.getElementById('docDate');

        function initApp() {
            renderCategories();
            selectCategory(currentCat);
            initCanvas();
            initStampUpload();
            if (window.lucide) {
                lucide.createIcons();
            }
        }

        function renderCategories() {
            categoryContainer.innerHTML = '';
            Object.keys(FORMS).forEach(cat => {
                const btn = document.createElement('button');
                btn.className = `px-2 py-1 rounded text-xs font-medium transition ${cat === currentCat ? 'bg-blue-600 text-white' : 'text-slate-300 hover:text-white'}`;
                btn.innerText = cat;
                btn.onclick = () => selectCategory(cat);
                categoryContainer.appendChild(btn);
            });
        }

        function selectCategory(cat) {
            currentCat = cat;
            renderCategories();
            formSelect.innerHTML = '';
            FORMS[cat].forEach(f => {
                const opt = document.createElement('option');
                opt.value = f.id;
                opt.innerText = f.name;
                formSelect.appendChild(opt);
            });
            selectForm(FORMS[cat][0].id);
        }

        formSelect.onchange = (e) => selectForm(e.target.value);

        function selectForm(formId) {
            currentForm = FORMS[currentCat].find(f => f.id === formId) || FORMS[currentCat][0];
            formData = { ...currentForm.fields };
            currentFormBadge.innerText = currentForm.name;
            renderInputs();
            renderPreview();
        }

        function renderInputs() {
            dynamicInputFields.innerHTML = '';
            Object.keys(formData).forEach(key => {
                const div = document.createElement('div');
                div.className = 'flex flex-col gap-1';
                div.innerHTML = `
                    <label class="text-xs font-semibold text-slate-700">${key}</label>
                    <input type="text" value="${formData[key]}" oninput="updateField('${key}', this.value)" class="border border-slate-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
                `;
                dynamicInputFields.appendChild(div);
            });
        }

        function updateField(key, val) {
            formData[key] = val;
            renderPreview();
        }

        function renderPreview() {
            docTitle.innerText = currentForm.name;
            docContentContainer.innerText = currentForm.content;
            docFooterText.innerText = currentForm.footer;

            const today = new Date();
            docDate.innerText = `${today.getFullYear()}년 ${today.getMonth() + 1}월 ${today.getDate()}일`;

            let tableHTML = '<table class="w-full border-collapse border border-slate-900 text-sm"><tbody>';
            const keys = Object.keys(formData);
            
            keys.forEach(k => {
                tableHTML += `
                    <tr class="border-b border-slate-900">
                        <td class="bg-slate-100 font-bold p-2.5 text-center border-r border-slate-900 w-36 whitespace-nowrap">${k}</td>
                        <td class="p-2.5 border-r border-slate-900">${formData[k]}</td>
                    </tr>
                `;
            });
            tableHTML += '</tbody></table>';
            docTableContainer.innerHTML = tableHTML;

            const companyInput = document.getElementById('issuerCompany');
            const ceoInput = document.getElementById('issuerCEO');
            if (companyInput) document.getElementById('displayCompany').innerText = companyInput.value || '';
            if (ceoInput) document.getElementById('displayCEO').innerText = ceoInput.value || '';
        }

        // 서명 캔버스
        let canvas, ctx, isDrawing = false;
        function initCanvas() {
            canvas = document.getElementById('sigCanvas');
            if (!canvas) return;
            ctx = canvas.getContext('2d');
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 2;

            const getPos = (e) => {
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return { x: clientX - rect.left, y: clientY - rect.top };
            };

            const start = (e) => { isDrawing = true; ctx.beginPath(); const p = getPos(e); ctx.moveTo(p.x, p.y); };
            const move = (e) => { if (!isDrawing) return; const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); };
            const stop = () => { if (isDrawing) { isDrawing = false; syncSignature(); } };

            canvas.addEventListener('mousedown', start);
            canvas.addEventListener('mousemove', move);
            canvas.addEventListener('mouseup', stop);
            canvas.addEventListener('touchstart', start);
            canvas.addEventListener('touchmove', move);
            canvas.addEventListener('touchend', stop);
        }

        function clearCanvas() {
            if (!ctx) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            document.getElementById('sigImage').classList.add('hidden');
        }

        function syncSignature() {
            const sigImg = document.getElementById('sigImage');
            sigImg.src = canvas.toDataURL();
            sigImg.classList.remove('hidden');
        }

        // 도장 이미지 업로드
        function initStampUpload() {
            const stampInput = document.getElementById('stampUpload');
            if (!stampInput) return;
            stampInput.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(evt) {
                        const stampImg = document.getElementById('stampImage');
                        stampImg.src = evt.target.result;
                        stampImg.classList.remove('hidden');
                    };
                    reader.readAsDataURL(file);
                }
            });
        }

        // PDF 생성/다운로드
        function downloadPDF() {
            const element = document.getElementById('a4Paper');
            if (!window.html2pdf) {
                alert('PDF 생성 라이브러리를 로딩 중입니다. 잠시 후 다시 시도해 주세요.');
                return;
            }
            const opt = {
                margin: 0,
                filename: `${currentForm.name}_완성본.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2 },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };
            html2pdf().set(opt).from(element).save();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initApp);
        } else {
            initApp();
        }
    </script>
